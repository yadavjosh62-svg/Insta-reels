
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Reel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 540px;
      text-align: center;
    }

    .instagram-media {
      width: 100% !important;
      max-width: 540px !important;
      min-width: 0 !important;
      margin: 0 auto !important;
    }

    a {
      color: #c13584;
    }
  </style>
</head>

<body>
  <main>
    <blockquote
      class="instagram-media"
      data-instgrm-permalink="https://www.instagram.com/reel/DeHczfMzlE9/"
      data-instgrm-version="14"
      style="background:#fff; border:0; margin:0 auto;">

      <a
        href="https://www.instagram.com/reel/DeHczfMzlE9/"
        target="_blank"
        rel="noopener noreferrer">
        Instagram par Reel dekhein
      </a>

    </blockquote>

    <p>
      Reel load nahi ho rahi?
      <a
        href="https://www.instagram.com/reel/DeHczfMzlE9/"
        target="_blank"
        rel="noopener noreferrer">
        Yahan click karein
      </a>
    </p>
  </main>

  <script async src="https://www.instagram.com/embed.js"></script>
</body>
</html>
